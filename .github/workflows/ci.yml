---
name: Run CI Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TEST_DB_HOST: mariadb.example.com
  TEST_DB_PORT: 3306
  TEST_DB_USER: testuser
  TEST_DB_PASSWORD: "heyPassw-!*20oRd"
  TEST_DB_DATABASE: testn
jobs:
  # Fast static checks (lint + security lint + prettier + type checks). Runs
  # first and gates everything below, so a lint/security issue fails the build
  # in seconds without spinning up any database server.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint (eslint + eslint-plugin-security)
        run: npm run test:lint
      - name: Type checks
        run: npm run test:types

  setup:
    needs: lint
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'schedule' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/develop')  ||
      startsWith(github.ref, 'refs/heads/maintenance/3.2') ||
      startsWith(github.ref, 'refs/heads/maintenance/3.3') ||
      startsWith(github.ref, 'refs/heads/maintenance/3.4')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.final-matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        name: build matrix
        uses: mariadb-corporation/connector-ci-build-matrix@main
        with:
          additional-matrix: '[{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "node": 26},{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "node": 24}, {"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "node": 20}]'

  ci:
    name: ${{ matrix.name }}${{ matrix.node != 22 && format(' - node {0}', matrix.node) || '' }}
    needs: setup
    timeout-minutes: 50
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Test Environment
        id: setup-env
        uses: mariadb-corporation/connector-ci-setup@master
        with:
          db-type: ${{ matrix.db-type }}
          db-tag: ${{ matrix.db-tag }}
          test-db-password: ${{ env.TEST_DB_PASSWORD }}
          test-db-database: ${{ env.TEST_DB_DATABASE }}
          test-db-port: ${{ env.TEST_DB_PORT }}
          additional-conf: ${{ matrix.additional-conf || '' }}
          registry-user: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_USER || (secrets.DOCKER_TOKEN != '' && secrets.DOCKER_LOGIN || '') }}
          registry-password: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_TOKEN || secrets.DOCKER_TOKEN }}
          os: ${{ matrix.os }}
          maxscale-tag: ${{ matrix.maxscale-tag || ''}}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        # coverage.lcov (nyc) for Codecov
        run: npm run coverage:test && npm run coverage:create
        env:
          LOCAL_DB: ${{ steps.setup-env.outputs.database-type }}
          DB_TYPE: ${{ matrix.db-type }}
          TEST_DB_SERVER_CERT: ${{ matrix.db-type == 'container' && './.github/workflows/certs/ca_server.crt' || '' }}
          DB_VERSION: ${{ matrix.db-tag }}
          # the unix socket tests only run against a database installed on the runner itself,
          # not in a container (test/base.js reads a non-empty value as "socket available")
          LOCAL_SOCKET_AVAILABLE: ${{ steps.setup-env.outputs.database-type == 'local' && 'true' || '' }}
          # npm drops environment variables whose names contain a hyphen, so the
          # test process must receive this under a hyphen-free name (see test/base.js).
          MAXSCALE_TAG: ${{ matrix.maxscale-tag || '' }}

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov
          disable_search: true
          name: ${{ matrix.name }}
